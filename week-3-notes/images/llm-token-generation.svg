<svg viewBox="0 0 720 430" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arr1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5a7da3"/>
    </marker>
  </defs>
  <rect width="720" height="430" fill="#ffffff"/>

  <text x="360" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#214e7c">Generating one token at a time</text>

  <!-- Probability panel above the next slot -->
  <rect x="190" y="70" width="290" height="190" rx="10" fill="#f4f8fc" stroke="#bcd4ec" stroke-width="1.5"/>
  <text x="335" y="96" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1d4670">most likely next token</text>

  <!-- bar: pipeline (picked) -->
  <text x="300" y="135" text-anchor="end" font-size="13" fill="#1d4670" font-family="Consolas, monospace">pipeline</text>
  <rect x="310" y="123" width="92" height="20" rx="4" fill="#3f6ea5"/>
  <text x="408" y="138" font-size="12.5" font-weight="700" fill="#2b5183">68%</text>

  <!-- bar: warehouse -->
  <text x="300" y="173" text-anchor="end" font-size="13" fill="#5b7088" font-family="Consolas, monospace">warehouse</text>
  <rect x="310" y="161" width="28" height="20" rx="4" fill="#bcd4ec"/>
  <text x="344" y="176" font-size="12.5" fill="#6d8298">20%</text>

  <!-- bar: system -->
  <text x="300" y="211" text-anchor="end" font-size="13" fill="#5b7088" font-family="Consolas, monospace">system</text>
  <rect x="310" y="199" width="12" height="20" rx="4" fill="#bcd4ec"/>
  <text x="328" y="214" font-size="12.5" fill="#6d8298">8%</text>

  <text x="335" y="244" text-anchor="middle" font-size="11.5" font-style="italic" fill="#6d8298">the model picks the top one</text>

  <!-- arrow down into the slot -->
  <line x1="335" y1="262" x2="335" y2="312" stroke="#5a7da3" stroke-width="2.5" marker-end="url(#arr1)"/>

  <!-- token row -->
  <!-- settled tokens -->
  <rect x="90" y="316" width="90" height="46" rx="8" fill="#eef4fa" stroke="#9cbbdb" stroke-width="1.5"/>
  <text x="135" y="345" text-anchor="middle" font-size="17" fill="#1d4670" font-family="Consolas, monospace">The</text>

  <rect x="190" y="316" width="90" height="46" rx="8" fill="#eef4fa" stroke="#9cbbdb" stroke-width="1.5"/>
  <text x="235" y="345" text-anchor="middle" font-size="17" fill="#1d4670" font-family="Consolas, monospace">data</text>

  <!-- newly picked token -->
  <rect x="290" y="316" width="90" height="46" rx="8" fill="#3f6ea5" stroke="#2b5183" stroke-width="2"/>
  <text x="335" y="345" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff" font-family="Consolas, monospace">pipeline</text>

  <!-- next (empty) slot -->
  <rect x="400" y="316" width="90" height="46" rx="8" fill="#ffffff" stroke="#b9c8d8" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="445" y="346" text-anchor="middle" font-size="20" fill="#b9c8d8">?</text>

  <!-- repeat arrow -->
  <path d="M 382 308 C 410 292, 430 292, 444 308" fill="none" stroke="#5a7da3" stroke-width="2.2" marker-end="url(#arr1)"/>
  <text x="500" y="343" font-size="12.5" font-style="italic" fill="#6d8298">…then repeat</text>

  <text x="360" y="400" text-anchor="middle" font-size="14" fill="#4a647f">Given everything so far, the model picks the most likely next token, appends it, and repeats.</text>
</svg>
