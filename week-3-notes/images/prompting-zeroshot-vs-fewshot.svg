<svg viewBox="0 0 1040 480" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arr2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5a7da3"/>
    </marker>
    <style>
      .mono { font-family: Consolas, 'SF Mono', Menlo, monospace; }
      .prompt-card { fill: #f4f8fc; stroke: #bcd4ec; stroke-width: 1.5; }
      .out-card { fill: #eef4fa; stroke: #9cbbdb; stroke-width: 1.5; }
      .colhdr { text-anchor: middle; font-weight: 700; fill: #1d4670; }
      .sub { text-anchor: middle; fill: #6d8298; font-size: 13px; }
      .lbl { font-size: 11px; font-weight: 700; }
    </style>
  </defs>
  <rect width="1040" height="480" fill="#ffffff"/>

  <line x1="520" y1="44" x2="520" y2="452" stroke="#d4dde7" stroke-width="1.5" stroke-dasharray="5 6"/>

  <!-- ================= ZERO-SHOT ================= -->
  <text x="260" y="40" class="colhdr" font-size="22">Zero-shot</text>
  <text x="260" y="60" class="sub">instruction only — no examples</text>

  <rect class="prompt-card" x="55" y="78" width="410" height="96" rx="9"/>
  <text x="72" y="106" class="mono" font-size="13" fill="#34506e">Classify the sentiment:</text>
  <text x="72" y="130" class="mono" font-size="13" fill="#34506e">"I installed it to connect</text>
  <text x="72" y="150" class="mono" font-size="13" fill="#34506e"> our data warehouse."</text>

  <line x1="260" y1="176" x2="260" y2="214" stroke="#5a7da3" stroke-width="2.5" marker-end="url(#arr2)"/>

  <rect class="out-card" x="55" y="220" width="410" height="92" rx="9"/>
  <text x="72" y="246" class="mono" font-size="13" fill="#34506e">It reads as fairly neutral —</text>
  <text x="72" y="266" class="mono" font-size="13" fill="#34506e">they're just describing what</text>
  <text x="72" y="286" class="mono" font-size="13" fill="#34506e">they did with the product.</text>

  <rect x="55" y="326" width="186" height="22" rx="11" fill="#f1e4e0" stroke="#dbb8ae" stroke-width="1"/>
  <text x="148" y="341" text-anchor="middle" class="lbl" fill="#b06a55">wording varies run to run</text>

  <!-- ================= FEW-SHOT ================= -->
  <text x="780" y="40" class="colhdr" font-size="22">Few-shot</text>
  <text x="780" y="60" class="sub">instruction + worked examples</text>

  <rect class="prompt-card" x="575" y="78" width="430" height="196" rx="9"/>
  <text x="592" y="102" class="mono" font-size="12.5" fill="#34506e">Classify sentiment &amp; reason —</text>
  <text x="592" y="119" class="mono" font-size="12.5" fill="#34506e">follow this format exactly.</text>
  <text x="592" y="146" class="mono" font-size="12.5" fill="#6d8298">Review: "...loads instantly."</text>
  <text x="592" y="163" class="mono" font-size="12.5" fill="#2b5183">Sentiment: positive | Reason: fast</text>
  <text x="592" y="190" class="mono" font-size="12.5" fill="#6d8298">Review: "...crashed twice."</text>
  <text x="592" y="207" class="mono" font-size="12.5" fill="#2b5183">Sentiment: negative | Reason: unstable</text>
  <text x="592" y="234" class="mono" font-size="12.5" fill="#34506e">Review: "I installed it to connect</text>
  <text x="592" y="251" class="mono" font-size="12.5" fill="#34506e"> our data warehouse."</text>
  <text x="592" y="268" class="mono" font-size="12.5" fill="#34506e">Sentiment: &#9646;</text>

  <line x1="780" y1="276" x2="780" y2="306" stroke="#5a7da3" stroke-width="2.5" marker-end="url(#arr2)"/>

  <rect class="out-card" x="575" y="312" width="430" height="50" rx="9"/>
  <text x="592" y="343" class="mono" font-size="13" fill="#2b5183">Sentiment: neutral | Reason: setup / integration</text>

  <rect x="575" y="376" width="196" height="22" rx="11" fill="#e2efe5" stroke="#a9cdb3" stroke-width="1"/>
  <text x="673" y="391" text-anchor="middle" class="lbl" fill="#4a8a5e">same format every time &#10003;</text>

  <!-- bottom takeaway -->
  <text x="520" y="442" text-anchor="middle" font-size="14" fill="#4a647f">Examples condition the model, locking its output into a predictable shape.</text>
</svg>
